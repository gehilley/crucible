[project]
name = "crucible"
version = "0.0.0"
description = "Crucible v2: an independently held record of researcher-AI interaction (SPEC.md)"
requires-python = ">=3.11"
dependencies = ["crucible-core", "crucible-chain", "crucible-verify", "crucible-service", "crucible-client"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
crucible-core = { workspace = true }
crucible-chain = { workspace = true }
crucible-verify = { workspace = true }
crucible-service = { workspace = true }
crucible-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages"]
# `importlib` so two packages may each hold a test module of the same name.
addopts = "-q --strict-markers --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:crucible_.*"]
