[project]
name = "crucible-service"
version = "0.0.0"
description = "The Crucible service (SPEC.md §5): ingest, the journal, receipts, verification"
requires-python = ">=3.11"
dependencies = ["crucible-core", "crucible-chain", "crucible-verify", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "boto3>=1.35.20"]

[project.scripts]
crucible-service = "crucible_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible_service"]

[tool.uv.sources]
crucible-core = { workspace = true }
crucible-chain = { workspace = true }
crucible-verify = { workspace = true }
