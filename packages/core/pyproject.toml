[project]
name = "crucible-core"
version = "0.0.0"
description = "Crucible primitives: JCS canonicalization, sha256 digests, COSE_Sign1, Ed25519 keys"
requires-python = ">=3.11"
dependencies = [
    "rfc8785>=0.1.4",
    "pycose>=1.1.0",
    # pycose 1.1.0 calls isinstance(cose_obj, list) on the decoded CBOR tag value.
    # cbor2 >= 6.0 yields a tuple there, so CoseMessage.decode raises TypeError on
    # every well-formed message. Pin until pycose supports cbor2 6.x.
    "cbor2>=5.6,<5.7",
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible_core"]
