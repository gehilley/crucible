[project]
name = "crucible-verify"
version = "0.0.0"
description = "Crucible verification (SPEC.md §7): replay a chain, check its receipts, report"
requires-python = ">=3.11"
dependencies = ["crucible-core", "crucible-chain"]

[project.scripts]
crucible-verify = "crucible_verify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible_verify"]

[tool.uv.sources]
crucible-core = { workspace = true }
crucible-chain = { workspace = true }
